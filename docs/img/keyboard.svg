<svg xmlns="http://www.w3.org/2000/svg" width="960" height="722" viewBox="0 0 960 722" role="img" aria-labelledby="title desc"><title id="title">Горячие клавиши</title><desc id="desc">Подсвечены стрелки, Пробел, R, S, L, D и F. R начинает и останавливает запись; Пробел управляет суфлёром.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="0" y="0" width="960" height="722" rx="20" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="40" y="54" font-size="30" fill="#e8e9ec" text-anchor="start" font-weight="700">Горячие клавиши</text><text x="40" y="89" font-size="20" fill="#9aa0a8" text-anchor="start" font-weight="400">Самые нужные действия — без мыши</text><rect x="40" y="118" width="880" height="259" rx="16" fill="#15161d" stroke="#262934" stroke-width="2"/><rect x="70" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="96.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">Q</text><rect x="133" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="159.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">W</text><rect x="196" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="222.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">E</text><rect x="259" y="145" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="285.0" y="177" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">R</text><rect x="322" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="348.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">T</text><rect x="385" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="411.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">Y</text><rect x="448" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="474.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">U</text><rect x="511" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="537.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">I</text><rect x="574" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="600.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">O</text><rect x="637" y="145" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="663.0" y="177" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">P</text><rect x="95" y="210" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="121.0" y="242" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">A</text><rect x="158" y="210" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="184.0" y="242" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">S</text><rect x="221" y="210" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="247.0" y="242" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">D</text><rect x="284" y="210" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="310.0" y="242" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">F</text><rect x="347" y="210" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="373.0" y="242" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">G</text><rect x="410" y="210" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="436.0" y="242" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">H</text><rect x="473" y="210" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="499.0" y="242" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">J</text><rect x="536" y="210" width="52" height="48" rx="10" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="562.0" y="242" font-size="23" fill="#6f757e" text-anchor="middle" font-weight="600">K</text><rect x="599" y="210" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="625.0" y="242" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">L</text><rect x="159" y="290" width="355" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="336.5" y="322" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">Пробел</text><rect x="773" y="148" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="799.0" y="180" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">↑</text><rect x="710" y="211" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="736.0" y="243" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">←</text><rect x="773" y="211" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="799.0" y="243" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">↓</text><rect x="836" y="211" width="52" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="862.0" y="243" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">→</text><text x="790" y="319" font-size="19" fill="#9aa0a8" text-anchor="middle" font-weight="400">стрелки</text><rect x="40" y="399" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="99.5" y="431" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">←  →</text><text x="177" y="430" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">слайды</text><rect x="490" y="399" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="549.5" y="431" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">Пробел</text><text x="627" y="430" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">суфлёр: пуск / пауза</text><rect x="40" y="462" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="99.5" y="494" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">↑  ↓</text><text x="177" y="493" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">прокрутка текста</text><rect x="490" y="462" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="549.5" y="494" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">R</text><text x="627" y="493" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">запись: старт / стоп</text><rect x="40" y="525" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="99.5" y="557" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">S</text><text x="177" y="556" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">экран / слайд</text><rect x="490" y="525" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="549.5" y="557" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">L</text><text x="627" y="556" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">лазер</text><rect x="40" y="588" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="99.5" y="620" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">D</text><text x="177" y="619" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">рисование</text><rect x="490" y="588" width="119" height="48" rx="10" fill="#302c1c" stroke="#262934" stroke-width="2"/><text x="549.5" y="620" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">F</text><text x="627" y="619" font-size="22" fill="#e8e9ec" text-anchor="start" font-weight="400">полный экран</text><text x="480" y="687" font-size="22" fill="#9aa0a8" text-anchor="middle" font-weight="400">Shift + ↑ / ↓ — скорость суфлёра</text></g></svg>
