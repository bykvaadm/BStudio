<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" role="img" aria-labelledby="title desc"><title id="title">Файлы папки урока</title><desc id="desc">В папке урока находятся deck_frames с p-01.png и следующими слайдами, необязательный 03-script.md и после записи lecture-….mp4.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="1" y="1" width="958" height="642" rx="22" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="40" y="53" font-size="28" fill="#e8e9ec" font-weight="700" text-anchor="start">Весь урок — в одной папке</text><rect x="92" y="108" width="776" height="453" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/><path d="M128 141 H167 L180 155 H227 V190 H128 Z" fill="#f5c518"/><text x="250" y="178" font-size="26" fill="#e8e9ec" font-weight="600" text-anchor="start">Папка урока</text><path d="M151 213 L151 501" fill="none" stroke="#262934" stroke-width="3" stroke-linecap="round"/><path d="M151 243 L200 243" fill="none" stroke="#262934" stroke-width="3" stroke-linecap="round"/><path d="M151 387 L200 387" fill="none" stroke="#262934" stroke-width="3" stroke-linecap="round"/><path d="M151 488 L200 488" fill="none" stroke="#262934" stroke-width="3" stroke-linecap="round"/><path d="M202 224 H224 L234 232 H259 V259 H202 Z" fill="#f5c518"/><text x="279" y="251" font-size="24" fill="#e8e9ec" font-weight="600" text-anchor="start">deck_frames/</text><text x="664" y="251" font-size="21" fill="#9aa0a8" font-weight="400" text-anchor="start">Слайды</text><path d="M228 274 L228 341" fill="none" stroke="#262934" stroke-width="2" stroke-linecap="round"/><path d="M228 289 L268 289" fill="none" stroke="#262934" stroke-width="2" stroke-linecap="round"/><path d="M228 330 L268 330" fill="none" stroke="#262934" stroke-width="2" stroke-linecap="round"/><text x="282" y="296" font-size="22" fill="#e8e9ec" font-weight="400" text-anchor="start">p-01.png</text><text x="282" y="337" font-size="22" fill="#9aa0a8" font-weight="400" text-anchor="start">p-02.png, …</text><rect x="202" y="366" width="39" height="47" rx="5" fill="#23252e" stroke="#262934" stroke-width="2"/><text x="221" y="397" font-size="27" fill="#f5c518" font-weight="500" text-anchor="middle">≡</text><text x="279" y="397" font-size="24" fill="#e8e9ec" font-weight="600" text-anchor="start">03-script.md</text><text x="664" y="385" font-size="20" fill="#9aa0a8" font-weight="400" text-anchor="start">Текст</text><text x="664" y="410" font-size="18" fill="#9aa0a8" font-weight="400" text-anchor="start">для суфлёра</text><rect x="190" y="449" width="642" height="78" rx="12" fill="#14251d" stroke="#37d27a" stroke-width="2"/><rect x="207" y="465" width="35" height="44" rx="5" fill="#1a1d27" stroke="#37d27a" stroke-width="2"/><text x="225" y="494" font-size="19" fill="#37d27a" font-weight="500" text-anchor="middle">▶</text><text x="265" y="495" font-size="24" fill="#e8e9ec" font-weight="600" text-anchor="start">lecture-….mp4</text><text x="664" y="480" font-size="18" fill="#37d27a" font-weight="400" text-anchor="start">После</text><text x="664" y="504" font-size="18" fill="#37d27a" font-weight="400" text-anchor="start">записи</text><text x="480" y="609" font-size="20" fill="#9aa0a8" font-weight="400" text-anchor="middle">Текст необязателен. Готовое видео появится после «<tspan font-size="0">⏹</tspan><tspan aria-hidden="true">■</tspan>».</text></g></svg>
