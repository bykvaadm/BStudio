ие</text><path d="M261 505 L701 505" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><path d="M691 498 L701 505 L691 512" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="537" font-size="21" fill="#e8e9ec" font-weight="600" text-anchor="middle">Экран → студия → запись</text><text x="240" y="586" font-size="20" fill="#9aa0a8" font-weight="400" text-anchor="middle">Показывай материал здесь</text><text x="720" y="586" font-size="20" fill="#f5c518" font-weight="600" text-anchor="middle">Рисуй по картинке в студии</text></g></svg>
