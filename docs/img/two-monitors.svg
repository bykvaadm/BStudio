<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Запись с двумя мониторами</title><desc id="desc">Слева рабочий экран, справа студия с трансляцией рабочего экрана, камерой и рисунком. Рисовать нужно по картинке в студии.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="1" y="1" width="958" height="618" rx="22" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="40" y="52" font-size="28" fill="#e8e9ec" font-weight="700" text-anchor="start">Два монитора — удобнее записывать</text><circle cx="57" cy="107" r="19" fill="#f5c518"/><text x="57" y="114" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">1</text><text x="87" y="114" font-size="23" fill="#e8e9ec" font-weight="600" text-anchor="start">Рабочий экран</text><circle cx="537" cy="107" r="19" fill="#f5c518"/><text x="537" y="114" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">2</text><text x="567" y="114" font-size="23" fill="#e8e9ec" font-weight="600" text-anchor="start">Окно студии</text><rect x="40" y="147" width="400" height="278" rx="16" fill="#15161d" stroke="#262934" stroke-width="2"/><rect x="54" y="161" width="372" height="240" rx="6" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><rect x="219" y="426" width="42" height="39" rx="2" fill="#23252e" stroke="#262934" stroke-width="2"/><rect x="152" y="466" width="176" height="12" rx="5" fill="#262934" stroke="#262934" stroke-width="2"/><rect x="520" y="147" width="400" height="278" rx="16" fill="#15161d" stroke="#262934" stroke-width="2"/><rect x="534" y="161" width="372" height="240" rx="6" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><rect x="699" y="426" width="42" height="39" rx="2" fill="#23252e" stroke="#262934" stroke-width="2"/><rect x="632" y="466" width="176" height="12" rx="5" fill="#262934" stroke="#262934" stroke-width="2"/><rect x="68" y="185" width="344" height="18