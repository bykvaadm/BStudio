<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc"><title id="title">Суфлёр: читай в своём темпе</title><desc id="desc">Текущая строка выделена. Пробел запускает и останавливает текст, Shift со стрелками меняет скорость.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="0" y="0" width="960" height="526" rx="20" fill="#0b0c0f" stroke="#262934" stroke-width="2" /><text x="40" y="54" font-size="30" fill="#e8e9ec" text-anchor="start" font-weight="700">Суфлёр: читай в своём темпе</text><text x="40" y="88" font-size="20" fill="#9aa0a8" text-anchor="start" font-weight="400">Читай выделенную строку — текст движется сам</text><rect x="40" y="116" width="880" height="258" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="92" y="170" font-size="29" fill="#9aa0a8" text-anchor="start" font-weight="400">Сегодня разберём, как устроен урок.</text><rect x="66" y="191" width="746" height="58" rx="9" fill="#302c1c" stroke="#f5c518" stroke-width="2" /><text x="92" y="230" font-size="32" fill="#e8e9ec" text-anchor="start" font-weight="600">Одна мысль — один слайд.</text><text x="92" y="289" font-size="29" fill="#9aa0a8" text-anchor="start" font-weight="400">Покажи пример и сделай паузу.</text><text x="92" y="339" font-size="29" fill="#9aa0a8" text-anchor="start" font-weight="400">Затем переходи к следующей теме.</text><circle cx="862" cy="220" r="32" fill="#f5c518" /><circle cx="66" cy="421" r="16" fill="#f5c518" /><text x="66" y="427" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">1</text><rect x="94" y="397" width="150" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="169.0" y="429" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">Пробел</text><text x="265" y="429" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="400">пуск / пауза</text><circle cx="502" cy="421" r="16" fill="#f5c518" /><text x="502" y="427" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">2</text><rect x="530" y="397" width="180" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="620.0" y="429" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">Shift + ↑ ↓</text><text x="732" y="429" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="400">скорость</text><text x="480" y="490" font-size="20" fill="#9aa0a8" text-anchor="middle" font-weight="400">Можно нажать на сам текст</text><g transform="translate(862.0 223.0)" fill="#0b0c0f" stroke="#0b0c0f" stroke-width="2" stroke-linejoin="round"><path d="M-7 -10 h4 v20 h-4 z M3 -10 h4 v20 h-4 z" stroke="none" /></g></g></svg>