<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Три способа подать слайды</title>
  <desc id="desc">Картинки работают без интернета. Для PDF нужен интернет. HTML-деку из Claude Design сохрани одним файлом: студия сама переснимет её в кадры. Помести выбранный источник в папку урока и нажми «▶ Поехали».</desc>
  <g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif">
    <rect x="1" y="1" width="958" height="578" rx="22" fill="#0b0c0f" stroke="#262934" stroke-width="2"/>
    <text x="40" y="54" fill="#e8e9ec" font-size="28" font-weight="700">Три способа подать слайды</text>
    <g fill="#15161d" stroke="#262934" stroke-width="2">
      <rect x="40" y="94" width="280" height="288" rx="18"/>
      <rect x="340" y="94" width="280" height="288" rx="18"/>
      <rect x="640" y="94" width="280" height="288" rx="18"/>
    </g>
    <g fill="#e8e9ec" font-size="25" font-weight="600" text-anchor="middle">
      <text x="180" y="133">Картинки</text>
      <text x="480" y="133">PDF</text>
      <text x="780" y="133">HTML-дека</text>
    </g>
    <!-- Папка с последовательностью картинок. -->
    <path d="M105 166 H154 L168 180 H255 V266 H105 Z" fill="#23252e" stroke="#f5c518" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#e8e9ec" font-size="20" text-anchor="middle">
      <text x="180" y="214">p-01.png</text>
      <text x="180" y="245">p-02.png…</text>
    </g>
    <text x="180" y="322" fill="#37d27a" font-size="19" text-anchor="middle">работает без интернета</text>
    <!-- Файл PDF. -->
    <path d="M440 160 H493 L520 187 V267 H440 Z" fill="#23252e" stroke="#f5c518" stroke-width="2" stroke-linejoin="round"/>
    <path d="M493 160 V187 H520" fill="none" stroke="#f5c518" stroke-width="2" stroke-linejoin="round"/>
    <text x="480" y="237" fill="#f5c518" font-size="25" font-weight="600" text-anchor="middle">.pdf</text>
    <text x="480" y="322" fill="#9aa0a8" font-size="19" text-anchor="middle">нужен интернет</text>
    <!-- Одна HTML-дека. -->
    <rect x="722" y="166" width="116" height="91" rx="10" fill="#23252e" stroke="#f5c518" stroke-width="2"/>
    <path d="M722 189 H838" fill="none" stroke="#f5c518" stroke-width="2"/>
    <circle cx="734" cy="178" r="3" fill="#f5c518"/>
    <path d="M761 207 L750 220 L761 233 M799 207 L810 220 L799 233 M786 204 L775 236" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#9aa0a8" font-size="19" text-anchor="middle">
      <text x="780" y="290">из Claude Design,</text>
      <text x="780" y="315">одним файлом</text>
    </g>
    <text x="780" y="353" fill="#e8e9ec" font-size="15" text-anchor="middle">студия сама переснимет в кадры</text>
    <!-- Три источника сходятся в одну папку. -->
    <g fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 383 V413 Q180 425 192 425 H468 Q480 425 480 437 V457"/>
      <path d="M480 383 V457"/>
      <path d="M780 383 V413 Q780 425 768 425 H492 Q480 425 480 437"/>
      <path d="M472 447 L480 457 L488 447"/>
    </g>
    <rect x="330" y="470" width="300" height="70" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/>
    <path d="M353 490 H372 L380 498 H399 V522 H353 Z" fill="#f5c518"/>
    <text x="416" y="514" fill="#e8e9ec" font-size="24" font-weight="600">Папка урока</text>
    <path d="M643 505 H686 M676 497 L686 505 L676 513" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="700" y="478" width="190" height="54" rx="12" fill="#f5c518"/>
    <text x="795" y="513" fill="#0b0c0f" font-size="23" font-weight="600" text-anchor="middle">▶ Поехали</text>
  </g>
</svg>
