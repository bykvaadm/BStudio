<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-labelledby="title desc"><title id="title">Текст связан со слайдами</title><desc id="desc">Заголовки Слайд 1.1 и Слайд 1.2 в файле речитатива отделяют текст для второй и третьей картинок; первая картинка — титул.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="0" y="0" width="960" height="535" rx="20" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="40" y="54" font-size="30" fill="#e8e9ec" text-anchor="start" font-weight="700">Текст связан со слайдами</text><text x="40" y="89" font-size="20" fill="#9aa0a8" text-anchor="start" font-weight="400">Каждому слайду — свой фрагмент текста</text><rect x="40" y="119" width="404" height="378" rx="16" fill="#15161d" stroke="#262934" stroke-width="2"/><text x="66" y="156" font-size="23" fill="#9aa0a8" text-anchor="start" font-weight="400">03-script.md</text><rect x="61" y="183" width="362" height="130" rx="12" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="82" y="221" font-size="26" fill="#f5c518" text-anchor="start" font-weight="600">### Слайд 1.1</text><text x="82" y="260" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="400">Текст, который ты</text><text x="82" y="291" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="400">скажешь на этом слайде.</text><path d="M447 247 L537 247" fill="none" stroke="#f5c518" stroke-width="2"/><path d="M525 239 l12 8 -12 8" fill="none" stroke="#f5c518" stroke-width="2"/><rect x="555" y="181" width="365" height="134" rx="16" fill="#1a1d27" stroke="#262934" stroke-width="2"/><circle cx="582" cy="206" r="16" fill="#f5c518"/><text x="582" y="212" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">2</text><text x="615" y="214" font-size="24" fill="#e8e9ec" text-anchor="start" font-weight="600">Слайд 1.1</text><rect x="583" y="238" width="129" height="14" rx="4" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><rect x="583" y="264" width="201" height="10" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><rect x="583" y="285" width="159" height="10" rx="3" fill="#262934" stroke="#262934" stroke-width="2"/><rect x="61" y="340" width="362" height="130" rx="12" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="82" y="378" font-size="26" fill="#f5c518" text-anchor="start" font-weight="600">### Слайд 1.2</text><text x="82" y="417" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="400">Текст, который ты</text><text x="82" y="448" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="400">скажешь на этом слайде.</text><path d="M447 404 L537 404" fill="none" stroke="#f5c518" stroke-width="2"/><path d="M525 396 l12 8 -12 8" fill="none" stroke="#f5c518" stroke-width="2"/><rect x="555" y="338" width="365" height="134" rx="16" fill="#1a1d27" stroke="#262934" stroke-width="2"/><circle cx="582" cy="363" r="16" fill="#f5c518"/><text x="582" y="369" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">3</text><text x="615" y="371" font-size="24" fill="#e8e9ec" text-anchor="start" font-weight="600">Слайд 1.2</text><rect x="609" y="427" width="38" height="26" rx="4" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><rect x="674" y="410" width="38" height="43" rx="4" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><rect x="739" y="391" width="38" height="62" rx="4" fill="#f5c518" stroke="#f5c518" stroke-width="2"/></g></svg>
