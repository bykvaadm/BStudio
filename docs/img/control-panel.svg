<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605" role="img" aria-labelledby="title desc"><title id="title">Панель управления</title><desc id="desc">Шесть групп нижней панели: суфлёр, камера, рисование, запись, слайд и ещё. Группы увеличены и разложены в два ряда.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="0" y="0" width="960" height="605" rx="20" fill="#0b0c0f" stroke="#262934" stroke-width="2" /><text x="40" y="54" font-size="30" fill="#e8e9ec" text-anchor="start" font-weight="700">Панель управления</text><text x="40" y="88" font-size="20" fill="#9aa0a8" text-anchor="start" font-weight="400">Нужные настройки собраны в шесть групп</text><circle cx="57" cy="142" r="16" fill="#f5c518" /><text x="57" y="148" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">1</text><text x="84" y="150" font-size="19" fill="#9aa0a8" text-anchor="start" font-weight="400">Текст и скорость</text><path d="M180 162 L180 182" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="40" y="185" width="280" height="125" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="58" y="216" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="600">суфлёр</text><rect x="56" y="233" width="248" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="210" y="265" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">A−  A+</text><circle cx="357" cy="142" r="16" fill="#f5c518" /><text x="357" y="148" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">2</text><text x="384" y="150" font-size="19" fill="#9aa0a8" text-anchor="start" font-weight="400">Твой вид в кадре</text><path d="M480 162 L480 182" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="340" y="185" width="280" height="125" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="358" y="216" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="600">камера</text><rect x="356" y="233" width="248" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="499.0" y="265" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">вкл  ▭  ◯</text><circle cx="657" cy="142" r="16" fill="#f5c518" /><text x="657" y="148" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">3</text><text x="684" y="150" font-size="19" fill="#9aa0a8" text-anchor="start" font-weight="400">Пометки на слайде</text><path d="M780 162 L780 182" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="640" y="185" width="280" height="125" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="658" y="216" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="600">рисование</text><rect x="656" y="233" width="248" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="780.0" y="265" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">↗    ↶    ✏️</text><circle cx="57" cy="348" r="16" fill="#f5c518" /><text x="57" y="354" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">4</text><text x="84" y="356" font-size="19" fill="#9aa0a8" text-anchor="start" font-weight="400">Запуск и остановка</text><path d="M180 368 L180 388" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="40" y="391" width="280" height="125" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="58" y="422" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="600">запись</text><rect x="56" y="439" width="248" height="48" rx="10" fill="#c0392b" stroke="#262934" stroke-width="2" /><text x="196.0" y="471" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">Запись</text><circle cx="357" cy="348" r="16" fill="#f5c518" /><text x="357" y="354" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">5</text><text x="384" y="356" font-size="19" fill="#9aa0a8" text-anchor="start" font-weight="400">Листание и экран</text><path d="M480 368 L480 388" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="340" y="391" width="280" height="125" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="358" y="422" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="600">слайд</text><rect x="356" y="439" width="248" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="480.0" y="471" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">◀   2 / 8   ▶</text><circle cx="657" cy="348" r="16" fill="#f5c518" /><text x="657" y="354" font-size="18" fill="#0b0c0f" text-anchor="middle" font-weight="700">6</text><text x="684" y="356" font-size="19" fill="#9aa0a8" text-anchor="start" font-weight="400">Остальные действия</text><path d="M780 368 L780 388" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="640" y="391" width="280" height="125" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><text x="658" y="422" font-size="23" fill="#e8e9ec" text-anchor="start" font-weight="600">ещё</text><rect x="656" y="439" width="248" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="760.0" y="471" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">☰    ↺</text><text x="480" y="571" font-size="20" fill="#9aa0a8" text-anchor="middle" font-weight="400">Нажми на название группы, чтобы свернуть или развернуть её</text><g transform="translate(141 257)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><path d="M-7 -10 h4 v20 h-4 z M3 -10 h4 v20 h-4 z" stroke="none" /></g><g transform="translate(394.0 257.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-8" width="26" height="18" rx="3" fill="none" /><circle cx="0" cy="1" r="5" fill="none" /><path d="M-7 -8 v-4 h10 v4" fill="none" /></g><g transform="translate(113.0 463.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><circle cx="0" cy="0" r="8" stroke="none" /></g><g transform="translate(837.0 463.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><path d="M-10 -3 v-7 h7 M3 -10 h7 v7 M10 3 v7 H3 M-3 10 h-7 v-7" fill="none" /></g><path d="M99 247 l17 10 -17 10 z" fill="#e8e9ec" /></g></svg>