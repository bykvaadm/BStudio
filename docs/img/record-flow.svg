<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Запись в три шага</title><desc id="desc">Нажми Запись, дождись отсчёта 3-2-1 и запиши урок. Нажми стоп. Дождись сохранения файла в папку урока или скачивания браузером.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="1" y="1" width="958" height="518" rx="22" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="40" y="53" font-size="28" fill="#e8e9ec" font-weight="700" text-anchor="start">От кнопки записи до готового видео</text><rect x="40" y="108" width="260" height="284" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/><circle cx="70" cy="139" r="19" fill="#f5c518"/><text x="70" y="146" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">1</text><text x="101" y="147" font-size="23" fill="#e8e9ec" font-weight="600" text-anchor="start">Начни</text><rect x="350" y="108" width="260" height="284" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/><circle cx="380" cy="139" r="19" fill="#f5c518"/><text x="380" y="146" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">2</text><text x="411" y="147" font-size="23" fill="#e8e9ec" font-weight="600" text-anchor="start">Останови</text><rect x="660" y="108" width="260" height="284" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/><circle cx="690" cy="139" r="19" fill="#f5c518"/><text x="690" y="146" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">3</text><text x="721" y="147" font-size="23" fill="#e8e9ec" font-weight="600" text-anchor="start">Дождись файла</text><rect x="60" y="191" width="220" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2"/><text x="170.0" y="222" font-size="21" fill="#e8e9ec" font-weight="600" text-anchor="middle"><tspan font-size="0">⏺</tspan><tspan aria-hidden="true">●</tspan> Запись</text><text x="170" y="299" font-size="38" fill="#c0392b" font-weight="700" text-anchor="middle">3 · 2 · 1</text><text x="170" y="346" font-size="19" fill="#9aa0a8" font-weight="400" text-anchor="middle">Пошла запись</text><rect x="435" y="192" width="90" height="69" rx="12" fill="#c0392b" stroke="#c0392b" stroke-width="2"/><text x="480" y="239" font-size="38" fill="#e8e9ec" font-weight="600" text-anchor="middle"><tspan font-size="0">⏹</tspan><tspan aria-hidden="true">■</tspan></text><text x="480" y="300" font-size="22" fill="#e8e9ec" font-weight="500" text-anchor="middle">Урок закончен</text><text x="480" y="346" font-size="19" fill="#9aa0a8" font-weight="400" text-anchor="middle">Нажми стоп</text><path d="M740 190 H787 L809 212 V275 H740 Z" fill="#1a1d27" stroke="#37d27a" stroke-width="3"/><path d="M787 190 V212 H809" fill="none" stroke="#37d27a" stroke-width="3"/><text x="774" y="248" font-size="28" fill="#37d27a" font-weight="600" text-anchor="middle">▶</text><text x="790" y="304" font-size="21" fill="#e8e9ec" font-weight="600" text-anchor="middle">lecture-….mp4</text><text x="790" y="346" font-size="19" fill="#37d27a" font-weight="500" text-anchor="middle">В папке урока</text><path d="M309 245 L338 245" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round"/><path d="M328 238 L338 245 L328 252" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M619 245 L648 245" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round"/><path d="M638 238 L648 245 L638 252" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="447" font-size="21" fill="#f5c518" font-weight="500" text-anchor="middle">Пока «<tspan font-size="0">⏳</tspan><tspan aria-hidden="true">◷</tspan> сохраняю» — оставь вкладку открытой</text><text x="480" y="484" font-size="19" fill="#9aa0a8" font-weight="400" text-anchor="middle">Без выбранной папки файл скачается в браузере</text></g></svg>
