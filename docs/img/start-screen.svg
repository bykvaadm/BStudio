<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">Стартовый экран BStudio</title><desc id="desc">1 — выбрать папку; 2 — выбрать урок и слайды, затем Поехали; 3 — альтернативный вход для трансляции экрана.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="1" y="1" width="958" height="718" rx="22" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="44" y="53" font-size="28" fill="#e8e9ec" font-weight="700" text-anchor="start">Выбери, что показать в уроке</text><text x="44" y="83" font-size="19" fill="#9aa0a8" font-weight="400" text-anchor="start">Слайды из папки или твой экран</text><rect x="240" y="112" width="480" height="540" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/><text x="280" y="157" font-size="30" fill="#e8e9ec" font-weight="700" text-anchor="start">BStudio</text><text x="280" y="190" font-size="17" fill="#9aa0a8" font-weight="400" text-anchor="start">Формат записи</text><rect x="555" y="169" width="119" height="30" rx="14" fill="#23252e" stroke="#262934" stroke-width="2"/><text x="614" y="191" font-size="18" fill="#f5c518" font-weight="600" text-anchor="middle">MP4</text><rect x="280" y="215" width="400" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2"/><text x="480.0" y="246" font-size="21" fill="#e8e9ec" font-weight="600" text-anchor="middle"><tspan font-size="0">📁</tspan><tspan aria-hidden="true">▰</tspan> Выбрать папку</text><circle cx="248" cy="239" r="19" fill="#f5c518"/><text x="248" y="246" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">1</text><text x="282" y="292" font-size="17" fill="#9aa0a8" font-weight="400" text-anchor="start">Урок</text><rect x="280" y="305" width="190" height="41" rx="14" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="295" y="333" font-size="19" fill="#e8e9ec" font-weight="400" text-anchor="start">Урок 1</text><text x="492" y="292" font-size="17" fill="#9aa0a8" font-weight="400" text-anchor="start">Слайды</text><rect x="490" y="305" width="190" height="41" rx="14" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="505" y="333" font-size="19" fill="#e8e9ec" font-weight="400" text-anchor="start">deck_frames</text><rect x="280" y="365" width="400" height="48" rx="10" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><text x="480.0" y="396" font-size="21" fill="#0b0c0f" font-weight="600" text-anchor="middle">▶ Поехали</text><circle cx="248" cy="389" r="19" fill="#f5c518"/><text x="248" y="396" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">2</text><text x="480" y="449" font-size="18" fill="#9aa0a8" font-weight="400" text-anchor="middle">или без слайдов</text><rect x="280" y="471" width="400" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2"/><text x="480.0" y="502" font-size="21" fill="#e8e9ec" font-weight="600" text-anchor="middle"><tspan font-size="0">🖥</tspan><tspan aria-hidden="true">▣</tspan> Транслировать экран</text><circle cx="248" cy="495" r="19" fill="#f5c518"/><text x="248" y="502" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">3</text><rect x="280" y="571" width="400" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2"/><text x="480.0" y="602" font-size="21" fill="#e8e9ec" font-weight="600" text-anchor="middle"><tspan font-size="0">📖</tspan><tspan aria-hidden="true">▤</tspan> Документация</text><text x="480" y="688" font-size="18" fill="#9aa0a8" font-weight="400" text-anchor="middle">«▶ Поехали» появится после выбора папки</text></g></svg>
