<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Мини-пульт всегда под рукой</title><desc id="desc">Мини-пульт внутри окна студии: слайды, суфлёр, запись и отметка, камера и полный размер камеры, экран и возврат панели.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="0" y="0" width="960" height="480" rx="20" fill="#0b0c0f" stroke="#262934" stroke-width="2" /><text x="40" y="54" font-size="30" fill="#e8e9ec" text-anchor="start" font-weight="700">Мини-пульт всегда под рукой</text><text x="40" y="89" font-size="20" fill="#9aa0a8" text-anchor="start" font-weight="400">После «⌄ свернуть» остаются главные кнопки</text><rect x="40" y="211" width="880" height="104" rx="16" fill="#15161d" stroke="#262934" stroke-width="2" /><rect x="58" y="240" width="135" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="125.5" y="272" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">◀  ▶</text><text x="125.5" y="153" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">слайд</text><path d="M125.5 165 L125.5 232" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="205" y="240" width="108" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="259.0" y="272" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">▶</text><text x="259.0" y="376" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">суфлёр</text><path d="M259.0 346 L259.0 297" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="325" y="240" width="170" height="48" rx="10" fill="#c0392b" stroke="#262934" stroke-width="2" /><text x="435.0" y="272" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">⚑</text><text x="410.0" y="153" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">запись</text><path d="M410.0 165 L410.0 232" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="507" y="240" width="130" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="572.0" y="376" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">камера</text><path d="M572.0 346 L572.0 297" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="649" y="240" width="116" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="707.0" y="153" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">экран</text><path d="M707.0 165 L707.0 232" fill="none" stroke="#f5c518" stroke-width="2" /><rect x="777" y="240" width="125" height="48" rx="10" fill="#23252e" stroke="#262934" stroke-width="2" /><text x="839.5" y="272" font-size="23" fill="#f5c518" text-anchor="middle" font-weight="600">⌃</text><text x="839.5" y="376" font-size="23" fill="#e8e9ec" text-anchor="middle" font-weight="600">панель</text><path d="M839.5 346 L839.5 297" fill="none" stroke="#f5c518" stroke-width="2" /><text x="480" y="440" font-size="22" fill="#9aa0a8" text-anchor="middle" font-weight="400">При записи: пауза / стоп     ·     ⚑ — отметка</text><g transform="translate(386.0 264.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><circle cx="0" cy="0" r="8" stroke="none" /></g><g transform="translate(546.0 264.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-8" width="26" height="18" rx="3" fill="none" /><circle cx="0" cy="1" r="5" fill="none" /><path d="M-7 -8 v-4 h10 v4" fill="none" /></g><g transform="translate(599.0 264.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><path d="M-10 -3 v-7 h7 M3 -10 h7 v7 M10 3 v7 H3 M-3 10 h-7 v-7" fill="none" /></g><g transform="translate(707.0 264.0)" fill="#e8e9ec" stroke="#e8e9ec" stroke-width="2" stroke-linejoin="round"><rect x="-14" y="-11" width="28" height="19" rx="2" fill="none" /><path d="M0 8 v6 M-8 14 H8" fill="none" /></g></g></svg>