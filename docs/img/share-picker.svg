<svg xmlns="http://www.w3.org/2000/svg" width="960" height="646" viewBox="0 0 960 646" role="img" aria-labelledby="title desc"><title id="title">Выбор экрана для трансляции</title><desc id="desc">1 — весь экран; 2 — нужный монитор; 3 — галочка звука. Перед трансляцией включи звук экрана в студии.</desc><g font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif"><rect x="1" y="1" width="958" height="644" rx="22" fill="#0b0c0f" stroke="#262934" stroke-width="2"/><text x="40" y="52" font-size="27" fill="#e8e9ec" font-weight="700" text-anchor="start">Выбери экран, который будешь показывать</text><rect x="140" y="92" width="680" height="473" rx="14" fill="#15161d" stroke="#262934" stroke-width="2"/><text x="174" y="139" font-size="27" fill="#e8e9ec" font-weight="600" text-anchor="start">Чем поделиться?</text><rect x="174" y="162" width="185" height="48" rx="9" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="266.5" y="194" font-size="21" fill="#9aa0a8" font-weight="600" text-anchor="middle">Вкладка</text><rect x="363" y="162" width="185" height="48" rx="9" fill="#1a1d27" stroke="#262934" stroke-width="2"/><text x="455.5" y="194" font-size="21" fill="#9aa0a8" font-weight="600" text-anchor="middle">Окно</text><rect x="552" y="162" width="234" height="48" rx="9" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><text x="669.0" y="194" font-size="21" fill="#0b0c0f" font-weight="600" text-anchor="middle">Весь экран</text><rect x="174" y="235" width="292" height="200" rx="10" fill="#1a1d27" stroke="#f5c518" stroke-width="2"/><rect x="189" y="250" width="262" height="149" rx="14" fill="#1a1d27" stroke="#262934" stroke-width="2"/><rect x="209.96" y="272.35" width="125.75999999999999" height="8" rx="4" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><rect x="209.96" y="303.64" width="162.44" height="6" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><rect x="209.96" y="323.01" width="123.13999999999999" height="6" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><rect x="209.96" y="342.38" width="144.10000000000002" height="6" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><text x="320" y="424" font-size="18" fill="#e8e9ec" font-weight="400" text-anchor="middle">Экран 1</text><circle cx="443" cy="253" r="13" fill="#f5c518"/><text x="443" y="259" font-size="18" fill="#0b0c0f" font-weight="700" text-anchor="middle">✓</text><rect x="488" y="235" width="298" height="200" rx="14" fill="#101116" stroke="#262934" stroke-width="2"/><rect x="503" y="250" width="268" height="149" rx="14" fill="#1a1d27" stroke="#262934" stroke-width="2"/><rect x="524.44" y="272.35" width="128.64" height="8" rx="4" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><rect x="524.44" y="303.64" width="166.16" height="6" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><rect x="524.44" y="323.01" width="125.96" height="6" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><rect x="524.44" y="342.38" width="147.4" height="6" rx="3" fill="#9aa0a8" stroke="#9aa0a8" stroke-width="2"/><text x="637" y="424" font-size="18" fill="#9aa0a8" font-weight="400" text-anchor="middle">Экран 2</text><rect x="174" y="468" width="27" height="27" rx="5" fill="#f5c518" stroke="#f5c518" stroke-width="2"/><text x="187" y="489" font-size="22" fill="#0b0c0f" font-weight="700" text-anchor="middle">✓</text><text x="213" y="489" font-size="22" fill="#e8e9ec" font-weight="400" text-anchor="start">звук</text><text x="174" y="536" font-size="17" fill="#9aa0a8" font-weight="400" text-anchor="start">Схема окна выбора в браузере</text><circle cx="122" cy="186" r="19" fill="#f5c518"/><text x="122" y="193" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">1</text><circle cx="122" cy="318" r="19" fill="#f5c518"/><text x="122" y="325" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">2</text><circle cx="122" cy="481" r="19" fill="#f5c518"/><text x="122" y="488" font-size="21" fill="#0b0c0f" font-weight="700" text-anchor="middle">3</text><text x="480" y="611" font-size="20" fill="#f5c518" font-weight="500" text-anchor="middle">Для звука: включи «звук экрана» в студии заранее</text></g></svg>
